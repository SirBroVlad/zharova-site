<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attractions of Tambov - The Bird of Happiness</title>
    <link rel="stylesheet" href="../game-styles.css">
    <link rel="stylesheet" href="attractions.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="task-page attractions-page">
    <!-- Фоновое изображение -->
    <div class="game-background">
        <img src="../photos/bird-background1.png" alt="The Bird of Happiness" class="bg-image">
        <div class="overlay"></div>
    </div>

    <div class="attractions-container">
        <h1 class="attractions-title">ATTRACTIONS OF TAMBOV</h1>
        
        <!-- Счётчик вопросов -->
        <div class="question-counter" id="questionCounter">1/5</div>

        <!-- Фотография -->
        <div class="photo-container">
            <img src="" alt="Attraction" class="attraction-photo" id="attractionPhoto" onclick="openLightbox()">
            <div class="photo-hint">Click to enlarge 🔍</div>
        </div>

        <!-- Варианты описаний -->
        <div class="descriptions-container">
            <div class="description-card left" id="leftDesc" onclick="selectAnswer('left')">
                <div class="checkbox">
                </div>
                <p class="description-text" id="leftText"></p>
            </div>
            
            <div class="description-card right" id="rightDesc" onclick="selectAnswer('right')">
                <div class="checkbox">
                </div>
                <p class="description-text" id="rightText"></p>
            </div>
        </div>

        <div class="result-message" id="resultMessage"></div>

        <div class="navigation-buttons">
            <a href="../index.html" class="nav-btn home">Back to menu</a>
        </div>
    </div>

    <!-- Lightbox для просмотра фото -->
    <div id="lightbox" class="lightbox" onclick="closeLightbox()">
        <span class="lightbox-close">&times;</span>
        <img class="lightbox-content" id="lightbox-img">
    </div>

    <!-- Финальное popup -->
    <div id="finalPopup" class="final-popup">
        <div class="popup-content">
            <div class="popup-emoji">🎉</div>
            <h2 class="popup-title">Fabulously!</h2>
            <p class="popup-text">You've completed all questions successfully!</p>
            <button class="menu-btn" onclick="goToMenu()">
                Back to Menu
            </button>
        </div>
    </div>

    <script src="attractions.js"></script>
</body>
</html>
