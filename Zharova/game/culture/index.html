<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Culture - The Bird of Happiness</title>
    <link rel="stylesheet" href="../game-styles.css">
    <link rel="stylesheet" href="culture.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="task-page culture-page">
    <!-- Фоновое изображение -->
    <div class="game-background">
        <div class="overlay"></div>
    </div>

    <div class="culture-container">
        <h1 class="culture-title">CULTURE</h1>
        
        <div class="instruction">
            <p>Match the portraits with their titles:</p>
        </div>

        <!-- Портреты с зонами для сброса -->
        <div class="portraits-grid" id="portraitsGrid">
            <!-- Портреты будут добавлены через JS с рандомизацией -->
        </div>

        <!-- Названия для перетаскивания -->
        <div class="titles-container" id="titlesContainer">
            <!-- Названия будут добавлены через JS с рандомизацией -->
        </div>

        <button class="check-btn" onclick="checkMatches()">
            ✓ Check
        </button>

        <div class="result-message" id="resultMessage"></div>

        <div class="navigation-buttons">
            <a href="../index.html" class="nav-btn home">Back to menu</a>
        </div>
    </div>

    <!-- Lightbox для просмотра портретов -->
    <div id="lightbox" class="lightbox" onclick="closeLightbox()">
        <span class="lightbox-close">&times;</span>
        <img class="lightbox-content" id="lightbox-img">
    </div>

    <script src="culture.js"></script>
</body>
</html>
